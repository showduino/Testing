; Showduino Ecosystem - multi-node firmware workspace
; Targets: UI (JC8048W550 S3), SUE (S3 Brain), IAN (S3 Action), KIDS (C3 Subnode)

[platformio]
default_envs = sue, ian, kids, ui

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags =
  -std=gnu++17
  -DSHOWDUINO_PROTO_V=1
lib_deps =
  bblanchon/ArduinoJson@^7.2.1

; -------------------------
; SUE (ESP32-S3 Brain)
; -------------------------
[env:sue]
board = esp32-s3-devkitc-1
build_flags =
  ${env.build_flags}
  -DSHOWDUINO_NODE_SUE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DSHOWDUINO_ENABLE_ESPNOW_UI=1
  -DSHOWDUINO_ENABLE_UART_IAN=1
lib_deps =
  ${env.lib_deps}

; -------------------------
; IAN (ESP32-S3 Action Node)
; -------------------------
[env:ian]
board = esp32-s3-devkitc-1
build_flags =
  ${env.build_flags}
  -DSHOWDUINO_NODE_IAN=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DSHOWDUINO_ENABLE_UART_SUE=1
  -DSHOWDUINO_ENABLE_UART_KIDS=1
lib_deps =
  ${env.lib_deps}

; -------------------------
; KIDS (ESP32-C3)
; -------------------------
[env:kids]
board = esp32-c3-devkitm-1
build_flags =
  ${env.build_flags}
  -DSHOWDUINO_NODE_KIDS=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DSHOWDUINO_ENABLE_UART_PARENT=1
lib_deps =
  ${env.lib_deps}

; -------------------------
; UI (JC8048W550 ESP32-S3)
; Keep minimal by default (no LVGL deps) for buildability.
; -------------------------
[env:ui]
board = esp32-s3-devkitc-1
build_flags =
  ${env.build_flags}
  -DSHOWDUINO_NODE_UI=1
  -DARDUINO_USB_CDC_ON_BOOT=0
  -DSHOWDUINO_UI_MINIMAL=1
  -DSHOWDUINO_ENABLE_ESPNOW_SUE=1
lib_deps =
  ${env.lib_deps}

